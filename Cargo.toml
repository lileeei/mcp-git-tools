[package]
name = "mcp-git-tools"
version = "0.1.0"
edition = "2021"
description = "Git tools implementation for the Model Context Protocol"
license = "MIT"

[dependencies]
# RMCP dependencies
rmcp = { version = "0.14.0", features = ["server", "transport-io"] }

# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "time"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
anyhow = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
# Testing
tempfile = "3"

[[bin]]
name = "mcp-git-server"
path = "src/bin/server.rs"

[lib]
name = "mcp_git_tools"
path = "src/lib.rs" 